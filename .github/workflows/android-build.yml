# Builds a fresh native Android app on EAS and submits it to the Google Play
# internal track. Like the iOS build workflow, this is NOT automatic — trigger
# it by pushing the `claude/android-build` branch, or from the Actions tab.
#
# Uses the EXPO_TOKEN secret. The Android keystore and Google Play service
# account credentials are read from EAS.
name: Android Build (Play internal)

on:
  push:
    branches:
      - claude/android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit to Play internal track
        run: eas build --platform android --profile production --non-interactive --auto-submit
