# Builds a fresh native iOS app on EAS and submits it to TestFlight. Unlike the
# OTA workflow, this is NOT automatic — native builds are slow and only needed
# when native code changes (e.g. adding a library). Trigger it by pushing a
# tag like `build-0.1.3`, or from the Actions tab (Run workflow).
#
# Uses the EXPO_TOKEN repository secret. Apple build + submit credentials are
# read from EAS (already set up from the existing TestFlight build).
name: iOS Build (TestFlight)

on:
  # Trigger a build by pushing the `claude/ios-build` branch (or a `build-*`
  # tag), or from the Actions tab via Run workflow.
  push:
    branches:
      - claude/ios-build
    tags:
      - 'build-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
